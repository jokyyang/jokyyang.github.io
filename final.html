<!DOCTYPE html>
<html lang = "en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title> kick stream </title>
<style>
    body {
        background: black;
        color: white;              
    }

    .navbar{
    background-color: black;
    padding: 10px;  
}

.navbar a{
    color: white;
    text-decoration: none;
    margin-right: 15px;
}
.navbar a.active{
    font-weight: bold;
    text-decoration: underline;
}

.table-dark { 
      --bs-table-bg: black; 
      --bs-table-border-color:white;
      --bs-table-hover-bg: black; 
    }
    
    
    table thead th { 
      color: gray; 
       border-bottom: 1px solid #575353; 
    }

    .thumb-sm { 
      width: 120px; 
      height: 68px; 
      object-fit: cover; 
      border-radius: 4px; 
      background: black; 
      display: block; 
    }

    .viewers-cell { 
      color: gray; 
      font-weight: 600; 
    }

    .category-cell { 
      color: gray; 
      font-size: 0.85rem; 
    }

    .lang-cell { 
      font-size: 0.8rem; 
      color: gray; 
      text-transform: uppercase; 
    }

    #home-msg {
      color: gray;
      margin-bottom: 20px;
    }

    .table tbody tr {
    cursor: pointer;
    }
</style>
</head>
<body>

    <div class="navbar">
        <a class="active" href="index.html">Home</a>
        <a href="lab3.html">Lab 3</a>
        <a href="lab4.html">Lab 4</a>
        <a href="lab5.html">Lab 5</a>
        <a href="lab6.html">Lab 6</a>
        </div>
<div id="page-home">
    <div class="container-fluid py-4 px-4">
        
        <h1 class="mb-1" style="color:#00e700">Kick Live Streams</h1>
        <div id="home-msg"></div>
        <h5 style="color:#00e700a9">Top Livestream By View</h5>
        <div class="table-responsive">
            <table class="table table-dark table-hover align-middle mb-0" id="streams-table" style="display:none">
                <thead>
                    <tr>
                      <th style="width:64px">Thumbnail</th>
                      <th>Channel</th>
                      <th>Stream Title</th>
                      <th>Category</th>
                      <th>Viewers</th>
                      <th>Language</th> 
                      <th>Started</th>
                      <th>Mature</th>
                      <th>Tags</th>
                    </tr>
                  </thead>
                  <tbody id="streams-body"></tbody>
                </table>
              </div>
            </div>
        </div> 

    <script>
           let ACCESS_TOKEN = '';

async function getToken() {
  const response = await fetch('https://id.kick.com/oauth/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({
      grant_type:    'client_credentials',
      client_id:     '01KPEXZEFWPGV20A8TW2VBKZSK',
      client_secret: '0b86050649d48a0115810449b1de2ccab2d22069b4f43d5bfc963ffc8d0206a5'
    })
  });

  const data = await response.json();
  ACCESS_TOKEN = data.access_token;
}           const API = 'https://api.kick.com/public/v1';

           function timeAgo(iso) {
  if (!iso) return '—';
  const minutes = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (minutes < 60) return `${minutes} minutes ago`;
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;
  return `${hours} hour${hours > 1 ? 's' : ''} ${mins} min${mins !== 1 ? 's' : ''} ago`;
}
           let allStreams = [];
           
           function showDetail(slug) {
            window.location.href = `finaldetailpage.html?slug=${encodeURIComponent(slug)}`;
}

           async function loadStreams() {
  const messageDiv = document.getElementById('home-msg');
  const table = document.getElementById('streams-table');
  const tableBody = document.getElementById('streams-body');

  try {
    const response = await fetch(`${API}/livestreams`, {
      headers: { Authorization: `Bearer ${ACCESS_TOKEN}` }
    });
    
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const { data } = await response.json();
    allStreams = data || [];
    messageDiv.textContent = '';
if (!allStreams.length) {
      messageDiv.textContent = 'No streams live right now.'; //like thats gonna happen
      return;
    }

    tableBody.innerHTML = allStreams.map(stream => `
      <tr onclick="showDetail('${stream.slug}')">
        <td>
          <img src="${stream.thumbnail || ''}" 
               class="thumb-sm" 
               onerror="this.style.background='#222';this.removeAttribute('src')" 
               alt="${stream.slug}">
        </td>
        <td class="fw-semibold">${stream.slug}</td>
        <td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#aaa;font-size:0.88rem">
          ${stream.stream_title || 'Untitled'}
        </td>
        <td class="category-cell">${stream.category?.name || '—'}</td>
        <td class="viewers-cell">${stream.viewer_count || 0}</td>
        <td class="lang-cell">${(stream.language || '—').toUpperCase()}</td>
        <td style="color:#888;font-size:0.82rem">${timeAgo(stream.started_at)}</td>
        <td>${stream.has_mature_content ? '<span class="badge bg-danger">18+</span>' : '<span style="color:#444">—</span>'}</td>
        <td style="font-size:0.8rem;color:gray">${stream.custom_tags?.length ? stream.custom_tags.join(', ') : '—'}</td>
      </tr>
    `).join('');
    
    table.style.display = '';


} catch (e) {
    tableBody.innerHTML = '<tr><td colspan="9" class="text-danger">Failed to load streams</td></tr>';
  }
}
getToken().then(() => loadStreams());
    </script>

</body>
</html>
